[preset.0]

name="iOS"
platform="iOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.cfg, *.txt"
; login.cfg·hunt.cfg 는 맥 시험용 계정이다 — 공개 내려받기에 실리면 계정이 새고, 윈도우판은 그 계정으로 자동 로그인한다.
exclude_filter="login.cfg, hunt.cfg, export_presets.cfg"
export_path="build/ios/LodClient.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
application/app_store_team_id=""
application/bundle_identifier="com.fallendev.lod.client"
application/short_version="0.1.0"
application/version="1"
architectures/arm64=true
; iOS 14 부터 같은 망의 기기에 붙으려면 로컬 네트워크 권한이 필요하다. 이 문구가 없으면
; 시스템이 묻지도 않고 조용히 막는다 — 서버에는 연결 시도조차 도착하지 않는다.
application/additional_plist_content="<key>NSLocalNetworkUsageDescription</key><string>같은 Wi-Fi 의 시험 서버에 접속합니다.</string>"

