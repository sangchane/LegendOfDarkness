<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LOD 대시보드 로그인</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f2f4f6; --card: #fff; --ink: #191f28; --muted: #6b7684; --line: #e5e8eb; --blue: #3182f6; --bad: #f04452; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    main { width: 100%; max-width: 360px; background: var(--card); border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
    .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; }
    h1 { font-size: 20px; margin: 0; }
    /* 카카오 로그인 단추 — 카카오 디자인 가이드(노랑 #FEE500, 검정 말풍선, 글자 85%) */
    .kakao { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px;
             background: #FEE500; color: rgba(0,0,0,.85); font-weight: 600; text-decoration: none; }
    .kakao svg { width: 20px; height: 20px; fill: #000; }
    .kakao:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .error { color: var(--bad); font-size: 14px; min-height: 21px; margin: 10px 0 0; }
    details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
    summary { color: var(--muted); font-size: 14px; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
    form { margin-top: 12px; }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #f9fafb; }
    input[type=password]:focus { outline: 2px solid var(--blue); outline-offset: 1px; background: #fff; }
    .keep { display: flex; gap: 8px; align-items: center; margin: 14px 0 20px; color: var(--ink); font-size: 15px; }
    .keep input { width: 18px; height: 18px; accent-color: var(--blue); }
    button { width: 100%; font: inherit; font-weight: 600; padding: 13px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">L</span><h1>LOD 대시보드</h1></div>
    <a class="kakao" id="kakao" href="/api/kakao/start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.8 1.8 5.27 4.54 6.69l-.97 3.56c-.09.31.27.56.54.38l4.2-2.78c.55.07 1.11.11 1.69.11 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/></svg>카카오 로그인</a>
    <p class="error" id="error" role="alert"></p>
    <details>
      <summary>관리자 비밀번호로 들어가기</summary>
      <form id="login" autocomplete="on">
        <input type="text" name="username" value="lod-admin" autocomplete="username" hidden>
        <label for="password">관리자 비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label class="keep"><input id="remember" type="checkbox" checked> 로그인 유지 (30일)</label>
        <button type="submit">들어가기</button>
      </form>
    </details>
  </main>
  <script src="login.js"></script>
</body>
</html>
