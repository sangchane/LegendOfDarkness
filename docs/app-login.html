<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LOD 앱 로그인</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- 앱이 연 브라우저의 끝(사용자 2026-10-11 게임 로그인을 카카오로) — 앱에 넣을 6자리 번호를 보여 준다(app-login.js). -->
  <style>
    :root { --bg: #f2f4f6; --card: #fff; --ink: #191f28; --muted: #6b7684; --blue: #3182f6; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    .code { margin: 8px 0 16px; font-size: 40px; font-weight: 700; letter-spacing: 6px; color: var(--ink); font-variant-numeric: tabular-nums; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    main { width: 100%; max-width: 360px; background: var(--card); border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 24px rgba(0,0,0,.06); text-align: center; }
    .mark { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 14px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L</div>
    <div id="with-code" hidden>
      <h1>앱에 이 번호를 넣으세요</h1>
      <p class="code" id="code"></p>
      <p>LOD 앱으로 돌아가 「브라우저에 보이는 번호」 칸에 넣으면 들어갑니다. 10분 안에 넣어 주세요.</p>
    </div>
    <div id="without-code">
      <h1>번호를 보여 줄 수 없습니다</h1>
      <p>이 로그인은 이미 쓰였거나 지났습니다. 앱에서 처음부터 다시 해 주세요.</p>
    </div>
  </main>
  <script src="app-login.js"></script>
</body>
</html>
